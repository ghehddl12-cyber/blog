    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --rule:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --active-ink:     #fcfcfb;

      --surface-1:      #1a1a19;
      --surface-2:      #232322;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --rule:           #383835;
      --border:         rgba(255,255,255,0.10);
      --hover:          rgba(255,255,255,0.06);
      --active-bg:      #ffffff;
      --active-ink:     #0d0d0d;
      --gh:             #3987e5;
      --sb:             #199e70;
      --vc:             #9085e9;
      --etc:            #898781;
      --ok:             #0ca30c;
      --warn-ink:       #fab219;
      --warn-bg:        #3a2c0c;
      --sev-ink:        #ec835a;
      --sev-bg:         #3d2317;
      --off-bg:         #262625;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --rule:           #383835;
    --border:         rgba(255,255,255,0.10);
    --hover:          rgba(255,255,255,0.06);
    --active-bg:      #ffffff;
    --active-ink:     #0d0d0d;
    --gh:             #3987e5;
    --sb:             #199e70;
    --vc:             #9085e9;
    --etc:            #898781;
    --ok:             #0ca30c;
    --warn-ink:       #fab219;
    --warn-bg:        #3a2c0c;

    --off-bg:         #262625;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {

    background: var(--page);
    color: var(--text-primary);
    line-height: 1.5;
  }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display:inline-block; flex:none; }

  /* ================= layout ================= */
  .layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 30px;
    max-width: 1320px; margin: 0 auto; padding: 30px 24px 72px; align-items: start; }

  /* ================= sidebar ================= */
  .sidebar { position: sticky; top: 30px; min-width: 0; }
  .brand { display:flex; align-items:center; gap:9px; font-size: 16px; font-weight: 700;
    letter-spacing: -0.01em; padding: 0 12px 14px; }
  .brand .glyph { width:26px; height:26px; border-radius:8px; background: var(--active-bg);
    color: var(--active-ink); display:grid; place-items:center; font-size:13px; flex:none; }

  .nav { display:flex; flex-direction: column; gap: 2px; }
  .nav button {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    font: inherit; font-size: 13.5px; font-weight: 550; color: var(--text-secondary);
    background: transparent; border: none; border-radius: 9px;
    padding: 9px 12px; cursor: pointer;
  }
  .nav button:hover { background: var(--hover); color: var(--text-primary); }
  .nav button:focus-visible { outline: 2px solid var(--gh); outline-offset: 1px; }
  .nav button[aria-current="true"] { background: var(--active-bg); color: var(--active-ink); font-weight: 650; }
  .nav .n { flex:none; width: 19px; height: 19px; border-radius: 6px; background: var(--surface-2);
    color: var(--text-muted); font-size: 10.5px; font-weight: 700; display:grid; place-items:center; }
  .nav button[aria-current="true"] .n { background: color-mix(in srgb, var(--active-ink) 18%, transparent); color: var(--active-ink); }
  .nav .lbl { flex: 1 1 auto; min-width: 0; }
  .nav .cnt { flex:none; font-size: 11.5px; font-weight: 700; color: var(--text-muted);
    background: var(--surface-2); border-radius: 999px; padding: 1px 7px; }
  .nav button[aria-current="true"] .cnt { background: color-mix(in srgb, var(--active-ink) 20%, transparent); color: var(--active-ink); }
  .nav .cnt.alert { background: var(--sev-bg); color: var(--sev-ink); }

  .side-foot { margin-top: 18px; padding: 14px 12px 0; border-top: 1px solid var(--grid);
    font-size: 11.5px; color: var(--text-muted); }
  .side-foot .sync { display:inline-flex; align-items:center; gap:5px; font-weight:600;
    color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent);
    border-radius: 999px; padding: 3px 9px; margin-bottom: 8px; }
  .side-foot .line { margin-top: 3px; }
  .side-foot code { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  /* ================= main ================= */
  .view { display: none; animation: fade .16s ease-out; }
  .view.is-active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  .view-head { margin-bottom: 20px; }
  .view-head h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.015em; }
  .view-head p { font-size: 13.5px; color: var(--text-secondary); margin: 7px 0 0; max-width: 80ch; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px 22px; }
  .panel + .panel { margin-top: 14px; }

  /* ---------- KPI ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display:flex; align-items:center; gap:7px; }
  .stat-tile .value { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .stat-tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .overview-note { margin-top: 14px; }
  .ov-line { display:flex; gap:11px; align-items:flex-start; padding: 11px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
  .ov-line:last-child { border-bottom: none; }
  .ov-line .ic { flex:none; width:24px; height:24px; border-radius:7px; display:grid; place-items:center; font-size:12px; }
  .ov-line .ic.good { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .ov-line .ic.serious { background: var(--sev-bg); color: var(--sev-ink); }
  .ov-line .ic.warning { background: var(--warn-bg); color: var(--warn-ink); }
  .ov-line .ic.neutral { background: var(--off-bg); color: var(--text-muted); }
  .ov-line b { font-weight: 650; }
  .ov-line .go { margin-left:auto; flex:none; font-size:12.5px; font-weight:600; color: var(--text-muted);
    background:none; border:none; cursor:pointer; font-family: inherit; padding: 2px 4px; border-radius: 6px; }
  .ov-line .go:hover { color: var(--text-primary); background: var(--hover); }

  /* ---------- matrix ---------- */
  .legend { display:flex; flex-wrap:wrap; gap: 8px 18px; margin-bottom: 16px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .item { display:flex; align-items:center; gap:7px; }

  .matrix { width:100%; border-collapse: separate; border-spacing: 0; }
  .matrix th { text-align:left; font-size: 12px; font-weight:600; color: var(--text-secondary);
    padding: 0 12px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .matrix th .colhead { display:flex; align-items:center; gap:6px; }
  .matrix td { padding: 11px 12px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  .matrix tr:last-child td { border-bottom: none; }
  .matrix td.projcell { border-left: 4px solid transparent; padding-left: 14px; }
  .matrix tr.s-good  td.projcell { border-left-color: var(--ok); }
  .matrix tr.s-serious td.projcell { border-left-color: var(--sev-ink); }
  .matrix tr.s-warning td.projcell { border-left-color: var(--warn-ink); }
  .matrix tr.s-neutral td.projcell { border-left-color: var(--rule); }
  .pname { font-weight: 650; font-size: 14px; }
  .pdesc { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  .cell .mk { font-size: 11px; }
  .cell.on-gh { color: var(--gh); background: color-mix(in srgb, var(--gh) 12%, transparent); }
  .cell.on-sb { color: var(--sb); background: color-mix(in srgb, var(--sb) 14%, transparent); }
  .cell.on-vc { color: var(--vc); background: color-mix(in srgb, var(--vc) 14%, transparent); }
  .cell.on-etc { color: var(--text-secondary); background: var(--off-bg); }
  .cell.paused { color: var(--sev-ink); background: var(--sev-bg); }
  .cell.none { color: var(--text-muted); background: transparent; padding-left: 2px; font-weight: 500; }

  .verdict { display:inline-flex; align-items:center; gap:6px; font-size: 12.5px; font-weight:700;
    padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .verdict.good { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .verdict.serious { color: var(--sev-ink); background: var(--sev-bg); }
  .verdict.warning { color: var(--warn-ink); background: var(--warn-bg); }
  .verdict.neutral { color: var(--text-muted); background: var(--off-bg); }

  /* ---------- actions ---------- */
  .action { display:flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--grid); }
  .action:last-child { border-bottom: none; }
  .action:first-child { padding-top: 2px; }
  .action .mark { flex:none; width: 30px; height: 30px; border-radius: 9px; display:grid; place-items:center; font-size: 15px; }
  .action .mark.serious { background: var(--sev-bg); color: var(--sev-ink); }
  .action .mark.warning { background: var(--warn-bg); color: var(--warn-ink); }
  .action .atext .at { font-weight: 650; font-size: 13.5px; }
  .action .atext .ad { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }

  /* ---------- flow ---------- */
  .flow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .flow-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 8px; }
  .flow-head { display:flex; align-items:center; justify-content: space-between; gap:10px; margin-bottom: 4px; }
  .flow-title { font-weight: 700; font-size: 14px; }
  .flow-card svg { display:block; width: 100%; height: auto; }
  .nbox { fill: var(--surface-1); stroke: var(--border); }
  .ntitle { font-size: 13px; font-weight: 650; fill: var(--text-primary); }
  .nsub { font-size: 11px; fill: var(--text-muted); }
  .edgelab { font-size: 10.5px; fill: var(--text-muted); }

  /* ---------- notes ---------- */
  .note-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .note { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px; }
  .note .nt { font-weight: 650; font-size: 13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .note .nd { font-size: 12.5px; color: var(--text-secondary); margin-top: 5px; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 6px 0; }

  /* ================= responsive ================= */
  @media (max-width: 940px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 22px 16px 56px; }
    .sidebar { position: static; }
    .brand { padding: 0 2px 12px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px;
      scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    .nav button { width: auto; white-space: nowrap; padding: 8px 13px; }
    .nav .cnt { display: none; }
    .side-foot { margin-top: 10px; padding-top: 12px; }
    .flow-grid, .note-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .matrix thead { display: none; }
    .matrix, .matrix tbody, .matrix tr, .matrix td { display: block; width: 100%; }
    .matrix tr { border: 1px solid var(--border); border-radius: 11px; margin-bottom: 10px; padding: 4px 0; }
    .matrix td { border-bottom: none; padding: 5px 14px; }
    .matrix td.projcell { border-left: none; border-top: 4px solid transparent; border-radius: 11px 11px 0 0; }
    .matrix td[data-col]::before { content: attr(data-col); display:inline-block; width: 76px;
      font-size: 11px; color: var(--text-muted); }
  }
</style>
</head>

  neutral: { cls:"neutral", icon:"○", label:"다른 스택" }
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const chip = o => { const v = VERDICT[o]; return `<span class="verdict ${v.cls}">${v.icon} ${v.label}</span>`; };

function cellGithub(p){ return `<span class="cell on-gh"><span class="mk">✓</span>${esc(p.github.visibility)}</span>`; }
function cellSupabase(p){
  if (!p.supabase) return `<span class="cell none">—</span>`;
  return p.supabase.status === "ACTIVE_HEALTHY"
    ? `<span class="cell on-sb"><span class="mk">✓</span>활성</span>`
    : `<span class="cell paused"><span class="mk">⏸</span>일시정지</span>`;
}
function cellVercel(p){

  return p.vercel.state === "READY"
    ? `<span class="cell on-vc"><span class="mk">✓</span>배포됨</span>`
    : `<span class="cell paused"><span class="mk">⏸</span>${esc(p.vercel.state)}</span>`;
}
function cellEtc(p){
  if (!p.otherStack) return `<span class="cell none">—</span>`;
  return `<span class="cell on-etc"><span class="mk">◇</span>${esc(p.otherStack)}</span>`;
}

/* ---------------- pieces ---------------- */
function matrixHtml(data){
  const order = { good:0, serious:1, warning:2, neutral:3 };
  const rows = [...data.projects].sort((a,b) => order[a.overall] - order[b.overall]);
  return `
  <div class="legend">
    <span class="item"><span class="cell on-sb"><span class="mk">✓</span>연결·정상</span></span>
    <span class="item"><span class="cell paused"><span class="mk">⏸</span>연결됐지만 멈춤</span></span>
    <span class="item"><span class="cell none">—</span> 사용 안 함 / 미연결</span>
  </div>
  <table class="matrix">
    <thead><tr>
      <th style="width:33%">프로젝트</th>
      <th style="width:11%"><span class="colhead"><span class="swatch" style="background:var(--gh)"></span>GitHub</span></th>
      <th style="width:13%"><span class="colhead"><span class="swatch" style="background:var(--sb)"></span>Supabase</span></th>
      <th style="width:12%"><span class="colhead"><span class="swatch" style="background:var(--vc)"></span>Vercel</span></th>
      <th style="width:17%"><span class="colhead"><span class="swatch" style="background:var(--etc)"></span>기타 스택</span></th>
      <th style="width:14%">종합</th>
    </tr></thead>
    <tbody>${rows.map(p => `
      <tr class="s-${p.overall}">
        <td class="projcell"><div class="pname">${esc(p.title)}</div><div class="pdesc">${esc(p.desc)}</div></td>
        <td data-col="GitHub">${cellGithub(p)}</td>
        <td data-col="Supabase">${cellSupabase(p)}</td>
        <td data-col="Vercel">${cellVercel(p)}</td>
        <td data-col="기타">${cellEtc(p)}</td>
        <td data-col="종합">${chip(p.overall)}</td>
      </tr>`).join("")}</tbody>
  </table>`;
}

function flowCardHtml(p){
  const hasSb = !!p.supabase, hasVc = !!p.vercel;
  const sbPaused = hasSb && p.supabase.status !== "ACTIVE_HEALTHY";
  const H = hasSb ? 168 : 96;
  const gh = "var(--gh)", sb = "var(--sb)", vc = "var(--vc)", mut = "var(--text-muted)";
  const vcStroke = hasVc ? vc : mut;
  const sbStroke = sbPaused ? "var(--sev-ink)" : sb;
  const repo = p.github.repo;
  const repoFs = repo.length > 18 ? 10.5 : repo.length > 14 ? 11.5 : 13;

  let s = `<svg viewBox="0 0 520 ${H}" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="a-gh-${p.key}" markerWidth="7" markerHeight="7" refX="5.5" refY="2.75" orient="auto"><path d="M0,0 L5.5,2.75 L0,5.5 Z" fill="${gh}"/></marker>
    <marker id="a-vc-${p.key}" markerWidth="7" markerHeight="7" refX="5.5" refY="2.75" orient="auto"><path d="M0,0 L5.5,2.75 L0,5.5 Z" fill="${vcStroke}"/></marker>
    <marker id="a-sb-${p.key}" markerWidth="7" markerHeight="7" refX="5.5" refY="2.75" orient="auto"><path d="M0,0 L5.5,2.75 L0,5.5 Z" fill="${sbStroke}"/></marker>
  </defs>
  <rect x="2" y="16" width="104" height="46" rx="9" class="nbox" stroke-width="1.5"/>
  <text class="ntitle" x="54" y="37" text-anchor="middle">💻 내 코드</text>
  <text class="nsub" x="54" y="52" text-anchor="middle">git push</text>
  <line x1="108" y1="39" x2="160" y2="39" stroke="${gh}" stroke-width="2" marker-end="url(#a-gh-${p.key})"/>
  <rect x="166" y="16" width="164" height="46" rx="9" class="nbox" stroke="${gh}" stroke-width="2"/>
  <text class="ntitle" x="248" y="37" text-anchor="middle" style="font-size:${repoFs}px">🐙 ${esc(repo)}</text>
  <text class="nsub" x="248" y="52" text-anchor="middle">GitHub · ${esc(p.github.visibility)}</text>
  <line x1="332" y1="39" x2="388" y2="39" stroke="${vcStroke}" stroke-width="2" stroke-dasharray="${hasVc ? "none" : "5,4"}" marker-end="url(#a-vc-${p.key})"/>
  <text class="edgelab" x="360" y="30" text-anchor="middle">${hasVc ? "자동 배포" : "미연결"}</text>
  <rect x="394" y="16" width="124" height="46" rx="9" class="nbox" stroke="${vcStroke}" stroke-width="2" stroke-dasharray="${hasVc ? "none" : "5,4"}"/>
  <text class="ntitle" x="456" y="37" text-anchor="middle">${hasVc ? "▲ Vercel" : "▲ 없음"}</text>
  <text class="nsub" x="456" y="52" text-anchor="middle">${hasVc ? "배포 완료" : "확인 필요"}</text>`;

  if (hasSb) {
    s += `
  <line x1="248" y1="64" x2="248" y2="104" stroke="${sbStroke}" stroke-width="2" stroke-dasharray="${sbPaused ? "5,4" : "none"}" marker-end="url(#a-sb-${p.key})"/>
  <text class="edgelab" x="258" y="88" text-anchor="start">데이터 연결</text>
  <rect x="166" y="110" width="164" height="46" rx="9" class="nbox" stroke="${sbStroke}" stroke-width="2" stroke-dasharray="${sbPaused ? "5,4" : "none"}"/>
  <text class="ntitle" x="248" y="131" text-anchor="middle">⚡ Supabase DB</text>
  <text class="nsub" x="248" y="146" text-anchor="middle">${sbPaused ? "일시정지 — 깨우기 필요" : "정상 가동 중"}</text>`;
    if (hasVc) {
      s += `
  <path d="M 394 39 L 366 39 L 366 133 L 336 133" fill="none" stroke="${sbStroke}" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6"/>
  <text class="edgelab" x="400" y="137" text-anchor="start">앱이 DB를 조회</text>`;
    }
  }
  s += `</svg>`;
  return `<div class="flow-card">
    <div class="flow-head"><span class="flow-title">${esc(p.title)}</span>${chip(p.overall)}</div>${s}</div>`;
}

const noteHtml = (title, badge, body) =>
  `<div class="note"><div class="nt">${title} ${badge}</div><div class="nd">${body}</div></div>`;
const emptyHtml = msg => `<div class="empty">${msg}</div>`;

/* ---------------- views ---------------- */
function buildViews(data){
  const P = data.projects;
  const needsAction = P.filter(p => p.overall === "serious" || p.overall === "warning");
  const flowCards   = P.filter(p => p.supabase || p.vercel);
  const unlinked    = P.filter(p => !p.supabase && !p.vercel && !p.otherStack);
  const otherStack  = P.filter(p => p.otherStack);
  const okCount     = P.filter(p => p.overall === "good").length;
  const dbAsleep    = P.filter(p => p.supabase && p.supabase.status !== "ACTIVE_HEALTHY").length;

  return [
    {
      id: "overview", label: "개요", count: null,
      title: "개요",
      desc: "GitHub·Supabase·Vercel 계정에서 지금 가져온 숫자입니다. 자세한 내용은 왼쪽 메뉴에서 확인하세요.",
      html: `
        <div class="stat-row">
          <div class="stat-tile"><div class="label"><span class="swatch" style="background:var(--gh)"></span>GitHub 저장소</div>
            <div class="value">${data.github.total}</div><div class="sub">공개 ${data.github.publicCount} · 비공개 ${data.github.privateCount}</div></div>
          <div class="stat-tile"><div class="label"><span class="swatch" style="background:var(--sb)"></span>Supabase DB</div>
            <div class="value">${data.supabaseOrg.total}</div><div class="sub">가동 ${data.supabaseOrg.active} · 정지 ${data.supabaseOrg.inactive}</div></div>
          <div class="stat-tile"><div class="label"><span class="swatch" style="background:var(--vc)"></span>Vercel 배포</div>
            <div class="value">${data.vercelTeam.total}</div><div class="sub">모두 배포 성공</div></div>
          <div class="stat-tile"><div class="label">이번 달 비용</div>
            <div class="value">$${data.supabaseOrg.monthlyCost}</div><div class="sub">전부 무료 플랜</div></div>
          <div class="stat-tile"><div class="label">손봐야 할 항목</div>
            <div class="value">${needsAction.length}</div><div class="sub">완전 정상은 ${okCount}개</div></div>
        </div>
        <div class="panel overview-note">
          <div class="ov-line"><span class="ic good">●</span><span><b>${okCount}개</b>가 세 플랫폼 모두 연결되어 정상 운영 중입니다.</span>
            <button class="go" data-goto="matrix">보기 →</button></div>
          <div class="ov-line"><span class="ic serious">▲</span><span><b>${dbAsleep}개</b>의 Supabase DB가 잠들어 있습니다. 그중 배포까지 살아있는 것은 즉시 확인이 필요합니다.</span>
            <button class="go" data-goto="actions">보기 →</button></div>
          <div class="ov-line"><span class="ic warning">◆</span><span><b>${unlinked.length}개</b> 저장소는 아직 DB·배포가 연결되지 않았습니다.</span>
            <button class="go" data-goto="unlinked">보기 →</button></div>
          <div class="ov-line"><span class="ic neutral">○</span><span><b>${data.orphanSupabase.length}개</b>의 Supabase DB는 짝이 되는 저장소를 찾지 못했습니다.</span>
            <button class="go" data-goto="orphan">보기 →</button></div>
        </div>`
    },
    {
      id: "matrix", label: "연결 현황", count: P.length,
      title: "연결 현황 한눈에 보기",
      desc: "가로 한 줄이 프로젝트 하나입니다. 각 칸을 보면 그 프로젝트가 어떤 플랫폼을 쓰고 있고 지금 어떤 상태인지 바로 알 수 있습니다. 왼쪽 세로 색 막대는 종합 상태입니다.",
      html: `<div class="panel">${matrixHtml(data)}</div>`
    },
    {
      id: "actions", label: "손봐야 할 것", count: needsAction.length, alert: needsAction.length > 0,
      title: "지금 손봐야 할 것",
      desc: "정상이 아닌 항목만 모아, 무엇을 확인하면 되는지 정리했습니다.",
      html: `<div class="panel">${
        needsAction.length ? needsAction.map(p => `
          <div class="action">
            <div class="mark ${p.overall === 'serious' ? 'serious' : 'warning'}">${p.overall === 'serious' ? '▲' : '◆'}</div>
            <div class="atext"><div class="at">${esc(p.title)}</div><div class="ad">${esc(p.note)}</div></div>
          </div>`).join("") : emptyHtml("손봐야 할 항목이 없습니다. 전부 정상입니다.")
      }</div>`
    },
    {
      id: "flow", label: "배포 흐름", count: flowCards.length,
      title: "배포가 흘러가는 구조",
      desc: "실제로 플랫폼에 연결된 프로젝트만, 코드가 어디를 거쳐 서비스가 되는지 그렸습니다. 점선은 아직 연결되지 않았거나 멈춰 있는 구간입니다.",
      html: `<div class="panel"><div class="flow-grid">${
        flowCards.length ? flowCards.map(flowCardHtml).join("") : emptyHtml("플랫폼에 연결된 프로젝트가 아직 없습니다.")
      }</div></div>`
    },
    {
      id: "unlinked", label: "미연결 저장소", count: unlinked.length,
      title: "아직 플랫폼에 안 붙은 저장소",
      desc: "GitHub에만 있고 DB·배포가 연결되지 않은 저장소입니다. 초기 단계이거나 정리 대상일 수 있습니다.",
      html: `<div class="panel"><div class="note-grid">${
        unlinked.length ? unlinked.map(p => noteHtml(esc(p.title), chip(p.overall), esc(p.note))).join("")
                        : emptyHtml("모든 저장소가 플랫폼에 연결되어 있습니다.")
      }</div></div>`
    },
    {
      id: "orphan", label: "주인 없는 DB", count: data.orphanSupabase.length,
      title: "주인을 못 찾은 Supabase DB",
      desc: "어떤 저장소와 짝인지 이름으로 확인되지 않는 DB입니다. 안 쓰는 것이면 삭제해 정리할 수 있습니다.",
      html: `<div class="panel"><div class="note-grid">${
        data.orphanSupabase.length
          ? data.orphanSupabase.map(o => noteHtml(esc(o.name), `<span class="verdict warning">◆ 확인 필요</span>`,
              `${esc(o.region)} · ${esc(o.status)} — ${esc(o.note)}`)).join("")
          : emptyHtml("모든 DB가 저장소와 짝이 맞습니다.")
      }</div></div>`
    },
    {
      id: "other", label: "다른 스택", count: otherStack.length,
      title: "다른 스택으로 돌아가는 것",
      desc: "Supabase·Vercel을 쓰지 않아 위 집계와 별개로 관리되는 프로젝트입니다.",
      html: `<div class="panel"><div class="note-grid">${
        otherStack.length
          ? otherStack.map(p => noteHtml(esc(p.title), `<span class="verdict neutral">○ ${esc(p.otherStack)}</span>`, esc(p.note))).join("")
          : emptyHtml("해당하는 프로젝트가 없습니다.")
      }</div></div>`
    }
  ];
}

/* ---------------- app ---------------- */
function mount(data){
  const views = buildViews(data);
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");

  nav.innerHTML = views.map((v, i) => `
    <button type="button" data-view="${v.id}" aria-current="${i === 0}">
      <span class="n">${i}</span>
      <span class="lbl">${v.label}</span>
      ${v.count === null ? "" : `<span class="cnt${v.alert ? " alert" : ""}">${v.count}</span>`}
    </button>`).join("");

  main.innerHTML = views.map((v, i) => `
    <section class="view${i === 0 ? " is-active" : ""}" id="view-${v.id}">
      <div class="view-head"><h1>${v.title}</h1><p>${v.desc}</p></div>
      ${v.html}
    </section>`).join("");

  document.getElementById("sideFoot").innerHTML = `
    <div class="sync">⏱ 매시간 자동 갱신</div>
    <div class="line">스냅샷 ${esc(data.snapshot)}</div>
    <div class="line">GitHub <code>${esc(data.github.user)}</code></div>
    <div class="line">Supabase <code>${esc(data.supabaseOrg.plan)}</code> · Vercel <code>${esc(data.vercelTeam.name)}</code></div>`;

  const ids = views.map(v => v.id);
  function show(id, push){
    if (!ids.includes(id)) id = ids[0];
    nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === id)));
    main.querySelectorAll(".view").forEach(s => s.classList.toggle("is-active", s.id === "view-" + id));
    if (push && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  nav.addEventListener("click", e => {
    const b = e.target.closest("button[data-view]");
    if (b) show(b.dataset.view, true);
  });
  main.addEventListener("click", e => {
    const g = e.target.closest("button[data-goto]");
    if (g) show(g.dataset.goto, true);
  });
  window.addEventListener("hashchange", () => show(location.hash.slice(1), false));

  show(location.hash.slice(1) || ids[0], false);
}

mount(DATA);
</script>
</body>
</html>
