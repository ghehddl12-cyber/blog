<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 플랫폼 현황</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f4f3ef;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --rule:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --hover:          rgba(11,11,11,0.045);
    --active-bg:      #0b0b0b;
    --active-ink:     #fcfcfb;
    --gh:             #2a78d6;
    --sb:             #1baf7a;
    --sb-ink:         #0e7a54;
    --vc:             #4a3aa7;
    --etc:            #898781;
    --ok:             #0ca30c;
    --ok-solid:       #0ca30c;
    --warn-ink:       #8a5c08;
    --warn-bg:        #fdf0d0;
    --warn-solid:     #eda100;
    --sev-ink:        #a44a22;
    --sev-bg:         #fbe3d8;
    --sev-solid:      #d5622c;
    --off-bg:         #eeede8;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #232322;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --rule:           #383835;
      --border:         rgba(255,255,255,0.10);
      --hover:          rgba(255,255,255,0.06);
      --active-bg:      #ffffff;
      --active-ink:     #0d0d0d;
      --gh:             #3987e5;
      --sb:             #199e70;
      --sb-ink:         #46c795;
      --vc:             #9085e9;
      --etc:            #898781;
      --ok:             #0ca30c;
      --ok-solid:       #0ca30c;
      --warn-ink:       #fab219;
      --warn-bg:        #3a2c0c;
      --warn-solid:     #c98500;
      --sev-ink:        #ec835a;
      --sev-bg:         #3d2317;
      --sev-solid:      #d5622c;
      --off-bg:         #262625;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #232322;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --rule:           #383835;
    --border:         rgba(255,255,255,0.10);
    --hover:          rgba(255,255,255,0.06);
    --active-bg:      #ffffff;
    --active-ink:     #0d0d0d;
    --gh:             #3987e5;
    --sb:             #199e70;
    --sb-ink:         #46c795;
    --vc:             #9085e9;
    --etc:            #898781;
    --ok:             #0ca30c;
    --ok-solid:       #0ca30c;
    --warn-ink:       #fab219;
    --warn-bg:        #3a2c0c;
    --warn-solid:     #c98500;
    --sev-ink:        #ec835a;
    --sev-bg:         #3d2317;
    --sev-solid:      #d5622c;
    --off-bg:         #262625;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.5;
  }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display:inline-block; flex:none; }

  /* ================= layout ================= */
  .layout { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 32px;
    max-width: 1340px; margin: 0 auto; padding: 30px 24px 80px; align-items: start; }

  /* ================= sidebar ================= */
  .sidebar { position: sticky; top: 30px; min-width: 0; }
  .brand { display:flex; align-items:center; gap:9px; font-size: 16px; font-weight: 700;
    letter-spacing: -0.01em; padding: 0 12px 14px; }
  .brand .glyph { width:26px; height:26px; border-radius:8px; background: var(--active-bg);
    color: var(--active-ink); display:grid; place-items:center; font-size:13px; flex:none; }

  .nav { display:flex; flex-direction: column; gap: 2px; }
  .nav button {
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    font: inherit; font-size: 13.5px; font-weight: 550; color: var(--text-secondary);
    background: transparent; border: none; border-radius: 9px;
    padding: 9px 12px; cursor: pointer;
  }
  .nav button:hover { background: var(--hover); color: var(--text-primary); }
  .nav button:focus-visible { outline: 2px solid var(--gh); outline-offset: 1px; }
  .nav button[aria-current="true"] { background: var(--active-bg); color: var(--active-ink); font-weight: 650; }
  .nav .n { flex:none; width: 19px; height: 19px; border-radius: 6px; background: var(--surface-2);
    color: var(--text-muted); font-size: 10.5px; font-weight: 700; display:grid; place-items:center; }
  .nav button[aria-current="true"] .n { background: color-mix(in srgb, var(--active-ink) 18%, transparent); color: var(--active-ink); }
  .nav .lbl { flex: 1 1 auto; min-width: 0; }
  .nav .cnt { flex:none; font-size: 11.5px; font-weight: 700; color: var(--text-muted);
    background: var(--surface-2); border-radius: 999px; padding: 1px 7px; }
  .nav button[aria-current="true"] .cnt { background: color-mix(in srgb, var(--active-ink) 20%, transparent); color: var(--active-ink); }
  .nav .cnt.alert { background: var(--sev-solid); color: #fff; }
  .nav button[aria-current="true"] .cnt.alert { background: var(--sev-solid); color: #fff; }

  .side-foot { margin-top: 18px; padding: 14px 12px 0; border-top: 1px solid var(--grid);
    font-size: 11.5px; color: var(--text-muted); }
  .side-foot .sync { display:inline-flex; align-items:center; gap:5px; font-weight:600;
    color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent);
    border-radius: 999px; padding: 3px 9px; margin-bottom: 8px; }
  .side-foot .line { margin-top: 3px; }
  .side-foot code { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

  /* ================= main ================= */
  .view { display: none; animation: fade .16s ease-out; }
  .view.is-active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  .view-head { margin-bottom: 22px; }
  .view-head h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.015em; }
  .view-head p { font-size: 13.5px; color: var(--text-secondary); margin: 7px 0 0; max-width: 80ch; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px 22px; }

  /* group heading shared by every list */
  .group { margin-top: 30px; }
  .group:first-child { margin-top: 0; }
  .group-head { display:flex; align-items:center; gap:9px; margin-bottom: 12px; }
  .group-head .gdot { width:11px; height:11px; border-radius:50%; flex:none; }
  .group-head .gt { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .group-head .gc { font-size: 11.5px; font-weight: 700; color: var(--text-secondary);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .group-head .grule { flex: 1 1 auto; height: 1px; background: var(--grid); margin-left: 3px; }
  .group-head .ghint { font-size: 12px; color: var(--text-muted); }

  /* ---------- KPI ---------- */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; display:flex; align-items:center; gap:7px; }
  .stat-tile .value { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .stat-tile .sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .stat-tile.flag { border-color: color-mix(in srgb, var(--sev-solid) 45%, transparent);
    background: color-mix(in srgb, var(--sev-solid) 7%, var(--surface-1)); }
  .stat-tile.flag .value { color: var(--sev-ink); }

  /* health bar */
  .health { margin-top: 14px; }
  .health .hbar { display:flex; gap:2px; height: 12px; margin-bottom: 12px; }
  .health .seg { border-radius: 3px; min-width: 10px; }
  .health .seg:first-child { border-radius: 6px 3px 3px 6px; }
  .health .seg:last-child { border-radius: 3px 6px 6px 3px; }
  .health .hleg { display:flex; flex-wrap:wrap; gap: 6px 20px; }
  .health .hitem { display:flex; align-items:center; gap:7px; font-size: 12.5px; color: var(--text-secondary); }
  .health .hitem b { color: var(--text-primary); font-weight: 700; }

  .ov-line { display:flex; gap:11px; align-items:center; padding: 12px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; }
  .ov-line:last-child { border-bottom: none; }
  .ov-line .ic { flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-size:12px; }
  .ov-line .ic.good { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .ov-line .ic.serious { background: var(--sev-bg); color: var(--sev-ink); }
  .ov-line .ic.warning { background: var(--warn-bg); color: var(--warn-ink); }
  .ov-line .ic.neutral { background: var(--off-bg); color: var(--text-muted); }
  .ov-line b { font-weight: 700; }
  .ov-line .go { margin-left:auto; flex:none; font-size:12.5px; font-weight:600; color: var(--text-muted);
    background:none; border:none; cursor:pointer; font-family: inherit; padding: 4px 8px; border-radius: 7px; }
  .ov-line .go:hover { color: var(--text-primary); background: var(--hover); }
  .ov-line .go:focus-visible { outline: 2px solid var(--gh); outline-offset: 1px; }

  /* ---------- matrix (grouped card rows) ---------- */
  .legend { display:flex; flex-wrap:wrap; gap: 8px 18px; margin-bottom: 4px; font-size: 12.5px; color: var(--text-secondary); }
  .legend .item { display:flex; align-items:center; gap:7px; }

  .rows { display:flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: minmax(0,1.5fr) repeat(4, minmax(0,0.85fr)) auto;
    align-items: center; gap: 10px;
    background: var(--surface-1); border: 1px solid var(--border); border-left: 5px solid var(--rule);
    border-radius: 11px; padding: 13px 16px;
  }
  .row:hover { background: var(--hover); }
  .row > div { min-width: 0; }
  .row .clabel { display: none; }
  .row .cellwrap { display: flex; align-items: center; min-width: 0; }
  .row.s-good    { border-left-color: var(--ok-solid); }
  .row.s-serious { border-left-color: var(--sev-solid); }
  .row.s-warning { border-left-color: var(--warn-solid); }
  .row.s-neutral { border-left-color: var(--rule); }
  .row .pname { font-weight: 650; font-size: 14.5px; letter-spacing: -0.01em; }
  .row .pdesc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .colhead-row {
    display: grid; grid-template-columns: minmax(0,1.5fr) repeat(4, minmax(0,0.85fr)) auto;
    gap: 10px; padding: 0 16px 8px; border-bottom: 1px solid var(--grid); margin-bottom: 10px;
  }
  .colhead-row span { font-size: 11.5px; font-weight: 600; color: var(--text-muted);
    display:flex; align-items:center; gap:6px; }

  .cell { display:inline-flex; align-items:center; gap:6px; font-size: 12.5px; font-weight: 600;
    padding: 4px 10px; border-radius: 7px; white-space: nowrap; }
  .cell .mk { font-size: 11px; }
  .cell.on-gh { color: var(--gh); background: color-mix(in srgb, var(--gh) 12%, transparent); }
  .cell.on-sb { color: var(--sb); background: color-mix(in srgb, var(--sb) 14%, transparent); }
  .cell.on-vc { color: var(--vc); background: color-mix(in srgb, var(--vc) 14%, transparent); }
  .cell.on-etc { color: var(--text-secondary); background: var(--off-bg); white-space: normal; }
  .cell.paused { color: var(--sev-ink); background: var(--sev-bg); }
  .cell.none { color: var(--text-muted); background: transparent; padding-left: 2px; font-weight: 500; opacity: .65; }

  .verdict { display:inline-flex; align-items:center; gap:6px; font-size: 12.5px; font-weight:700;
    padding: 4px 11px; border-radius: 999px; white-space: nowrap; }
  .verdict.good { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .verdict.serious { color: var(--sev-ink); background: var(--sev-bg); }
  .verdict.warning { color: var(--warn-ink); background: var(--warn-bg); }
  .verdict.neutral { color: var(--text-muted); background: var(--off-bg); }

  /* ---------- actions ---------- */
  .act-major {
    display:flex; gap: 16px; align-items:flex-start;
    background: color-mix(in srgb, var(--sev-solid) 7%, var(--surface-1));
    border: 1px solid color-mix(in srgb, var(--sev-solid) 40%, transparent);
    border-left: 5px solid var(--sev-solid);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 10px;
  }
  .act-major .mk { flex:none; width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center;
    font-size: 17px; background: var(--sev-solid); color: #fff; }
  .act-major .t { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .act-major .d { font-size: 13.5px; color: var(--text-secondary); margin-top: 5px; }
  .act-major .fix { display:inline-flex; align-items:center; gap:7px; margin-top: 10px;
    font-size: 12.5px; font-weight: 650; color: var(--sev-ink);
    background: var(--surface-1); border: 1px solid color-mix(in srgb, var(--sev-solid) 35%, transparent);
    border-radius: 8px; padding: 6px 11px; }

  .act-minor { display:flex; gap: 13px; align-items:flex-start;
    background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--warn-solid);
    border-radius: 11px; padding: 13px 16px; margin-bottom: 8px; }
  .act-minor .mk { flex:none; width: 26px; height: 26px; border-radius: 8px; display:grid; place-items:center;
    font-size: 12px; background: var(--warn-bg); color: var(--warn-ink); }
  .act-minor .t { font-size: 13.5px; font-weight: 650; }
  .act-minor .d { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
  .act-minor .fix { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
  .act-minor .fix::before { content: "→ "; }

  /* ---------- flow (git graph) ---------- */
  .flow-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .flow-card { background: var(--surface-1); border: 1px solid var(--border);
    border-top: 4px solid var(--rule); border-radius: 12px; padding: 14px 16px 8px; }
  .flow-card.s-good    { border-top-color: var(--ok-solid); }
  .flow-card.s-serious { border-top-color: var(--sev-solid); }
  .flow-card.s-warning { border-top-color: var(--warn-solid); }
  .flow-head { display:flex; align-items:center; justify-content: space-between; gap:10px; margin-bottom: 4px; }
  .flow-title { font-weight: 700; font-size: 14.5px; }
  .flow-card svg { display:block; width: 100%; height: auto; }
  .flow-right { display:flex; align-items:center; gap:8px; }
  .fb { font-size: 11.5px; font-weight: 650; color: var(--sb); background: color-mix(in srgb, var(--sb) 14%, transparent);
    border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .fb.muted { color: var(--text-muted); background: var(--off-bg); }
  .gc-t { font-size: 12.5px; font-weight: 650; fill: var(--text-primary); }
  .gc-s { font-size: 10.5px; fill: var(--text-muted); }
  .gc-e { font-size: 10.5px; fill: var(--text-muted); }
  .gc-b { font-size: 12px; font-weight: 650; fill: var(--sb-ink); }
  .gc-d { font-size: 11px; font-weight: 650; fill: var(--vc); }

  /* ---------- notes ---------- */
  .note-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .note { display:flex; gap: 13px; align-items:flex-start;
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--rule); border-radius: 11px; padding: 14px 16px; }
  .note.k-warning { border-left-color: var(--warn-solid); }
  .note.k-neutral { border-left-color: var(--rule); }
  .note .ic { flex:none; width: 28px; height: 28px; border-radius: 9px; display:grid; place-items:center; font-size: 13px; }
  .note.k-warning .ic { background: var(--warn-bg); color: var(--warn-ink); }
  .note.k-neutral .ic { background: var(--off-bg); color: var(--text-muted); }
  .note .nt { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .note .nm { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .note .nd { font-size: 12.5px; color: var(--text-secondary); margin-top: 6px; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 6px 0; }

  /* ================= responsive ================= */
  @media (max-width: 1080px) {
    .row, .colhead-row { grid-template-columns: minmax(0,1.4fr) repeat(4, minmax(0,0.8fr)); }
    .row > .vcell, .colhead-row > .vhead { grid-column: 1 / -1; }
    .row > .vcell { margin-top: 2px; }
    .colhead-row > .vhead { display: none; }
  }
  @media (max-width: 940px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 22px 16px 56px; }
    .sidebar { position: static; }
    .brand { padding: 0 2px 12px; }
    .nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px;
      scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    .nav button { width: auto; white-space: nowrap; padding: 8px 13px; }
    .nav .cnt { display: none; }
    .side-foot { margin-top: 10px; padding-top: 12px; }
    .note-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .flow-card { overflow-x: auto; }
    .flow-card svg { min-width: 540px; }
    .colhead-row { display: none; }
    .row { grid-template-columns: 1fr; gap: 4px; align-items: start; }
    .row > .pcell { margin-bottom: 6px; }
    .row .cellwrap { gap: 8px; }
    .row .clabel { display: inline; font-size: 11px; color: var(--text-muted); width: 66px; flex:none; }
    .row > .vcell { margin-top: 8px; }
  }
</style>
</head>

      <div class="side-foot" id="sideFoot"></div>

  warning: { cls:"warning", icon:"◆", label:"확인 필요", color:"var(--warn-solid)", group:"확인 필요",      hint:"시간 날 때 정리하면 됩니다" },
  neutral: { cls:"neutral", icon:"○", label:"다른 스택", color:"var(--rule)",       group:"다른 스택",      hint:"이 집계와 별개입니다" }
};
const ORDER = ["good", "serious", "warning", "neutral"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const chip = o => { const v = VERDICT[o]; return `<span class="verdict ${v.cls}">${v.icon} ${v.label}</span>`; };

/* 상태에서 "무엇을 하면 되는지"를 자동으로 뽑아냅니다 */
function fixHint(p){
  const sbPaused = p.supabase && p.supabase.status !== "ACTIVE_HEALTHY";
  if (sbPaused && p.vercel) return "Supabase에서 이 프로젝트를 Restore 해서 DB를 다시 켜세요";
  if (sbPaused && !p.vercel) return "계속 쓸 거면 DB를 다시 켜고, 안 쓸 거면 삭제해 정리하세요";
  if (p.supabase && !p.vercel) return "어디에 배포했는지 확인하거나, Vercel에 저장소를 연결하세요";
  if (!p.supabase && !p.vercel) return "용도를 정해 DB·배포를 연결하거나, 안 쓰면 저장소를 정리하세요";
  return "상태를 한 번 확인해 보세요";
}

function groupHead(kind, count, hint){
  const v = VERDICT[kind];
  return `<div class="group-head">

    <span class="gt">${v.group}</span>
    <span class="gc">${count}</span>
    <span class="ghint">${hint || v.hint}</span>
    <span class="grule"></span>
  </div>`;
}

/* ---------------- flow (git graph) ---------------- */
const VB_W = 660, X0 = 70, X1 = 590, MAIN_Y = 66, NODE_R = 13, LANE_GAP = 52;

function textW(s, fs){
  let w = 0;
  for (const ch of String(s)) {
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) w += fs;
    else if (c > 0x2100) w += fs * 1.15;
    else if (/[A-Z]/.test(ch)) w += fs * 0.63;
    else if (/[ilj.,'\-!|]/.test(ch)) w += fs * 0.32;
    else w += fs * 0.56;
  }
  return w;
}
function truncToW(s, fs, maxW){
  s = String(s);
  if (textW(s, fs) <= maxW) return s;
  let out = "";
  for (const ch of s) { if (textW(out + ch + "…", fs) > maxW) break; out += ch; }
  return out + "…";
}
/* 글자가 칩을 넘치면 크기를 한 단계씩 줄이고, 그래도 넘치면 자릅니다 */
function fitText(s, sizes, maxW){
  for (const fs of sizes) if (textW(s, fs) <= maxW) return { text: s, fs };
  const fs = sizes[sizes.length - 1];
  return { text: truncToW(s, fs, maxW), fs };
}

function nodeChip(cx, color, title, sub, maxW){
  const inner = maxW - 22;
  const t = fitText(title, [12.5, 11.5, 10.5], inner);
  const s = fitText(sub, [10.5, 9.5], inner);
  const w = Math.max(96, Math.min(Math.max(textW(t.text, t.fs), textW(s.text, s.fs)) + 22, maxW));
  let x = Math.max(3, Math.min(cx - w / 2, VB_W - w - 3));
  const top = 6, h = 38, bot = top + h;
  return `<g>
    <rect x="${x}" y="${top}" width="${w}" height="${h}" rx="9" fill="${color}" opacity="0.10"/>
    <rect x="${x}" y="${top}" width="${w}" height="${h}" rx="9" fill="none" stroke="${color}" stroke-opacity="0.42"/>
    <path d="M ${cx - 5} ${bot} L ${cx + 5} ${bot} L ${cx} ${bot + 7} Z" fill="${color}" fill-opacity="0.42"/>
    <text class="gc-t" x="${x + w / 2}" y="${top + 16}" text-anchor="middle" style="font-size:${t.fs}px">${esc(t.text)}</text>
    <text class="gc-s" x="${x + w / 2}" y="${top + 30}" text-anchor="middle" style="font-size:${s.fs}px">${esc(s.text)}</text>
  </g>`;
}

function flowCardHtml(p){
  const hasSb = !!p.supabase, hasVc = !!p.vercel;
  const sbPaused = hasSb && p.supabase.status !== "ACTIVE_HEALTHY";
  const MAIN = "var(--vc)", BR = "var(--sb)", MUT = "var(--text-muted)", ALERT = "var(--sev-solid)";

  const branches = p.branches || [];
  const def = branches.find(b => b.isDefault) || branches[0] || { name: "main", head: "" };
  const side = branches.filter(b => b !== def);

  const nodes = [
    { title: "💻 내 코드", sub: "git push", color: MAIN },
    { title: p.github.repo, sub: `GitHub · ${p.github.visibility} · ${def.name}`, color: MAIN },
    hasVc ? { title: "▲ Vercel", sub: "배포 완료", color: MAIN }
          : { title: "▲ Vercel 없음", sub: "배포 확인 필요", color: MUT, muted: true }
  ];
  if (hasSb) nodes.push({
    title: "⚡ Supabase DB",
    sub: sbPaused ? "일시정지 — 깨우기 필요" : "정상 가동 중",
    color: sbPaused ? ALERT : MAIN, alert: sbPaused
  });

  const k = nodes.length;
  const gap = (X1 - X0) / (k - 1);
  const xs = nodes.map((_, i) => X0 + i * gap);
  const chipMax = Math.min(196, gap - 10);
  const H = side.length ? MAIN_Y + 58 + (side.length - 1) * LANE_GAP + 32 : MAIN_Y + 38;

  let s = `<svg viewBox="0 0 ${VB_W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`;

  for (let i = 0; i < k - 1; i++) {
    const isData = hasSb && i === k - 2, isDeploy = (i === 1 && !isData);
    const dashed = (isDeploy && !hasVc) || isData;
    const col = isData ? (sbPaused ? ALERT : MAIN) : (isDeploy && !hasVc ? MUT : MAIN);
    const label = isData ? "데이터 연결" : (i === 0 ? "푸시" : (hasVc ? "자동 배포" : "미연결"));
    s += `<line x1="${xs[i] + NODE_R}" y1="${MAIN_Y}" x2="${xs[i + 1] - NODE_R}" y2="${MAIN_Y}"
      stroke="${col}" stroke-width="2.5" ${dashed ? 'stroke-dasharray="5,4"' : ""}/>
      <text class="gc-e" x="${(xs[i] + xs[i + 1]) / 2}" y="${MAIN_Y + 18}" text-anchor="middle">${label}</text>`;
  }

  side.forEach((b, i) => {
    const laneY = MAIN_Y + 58 + i * LANE_GAP;
    const bx = xs[1] + 82;
    const same = def.head && b.head === def.head;
    const op = same ? 0.6 : 1;
    s += `<path d="M ${xs[1]} ${MAIN_Y + NODE_R} C ${xs[1]} ${laneY - 22}, ${xs[1] + 18} ${laneY}, ${xs[1] + 50} ${laneY} L ${bx - NODE_R - 2} ${laneY}"
      fill="none" stroke="${BR}" stroke-width="2.5" opacity="${op}" ${same ? 'stroke-dasharray="5,4"' : ""}/>
      <circle cx="${bx}" cy="${laneY}" r="${NODE_R - 2}" fill="${BR}" opacity="${op}"/>`;

    const st = same ? "main과 같은 위치" : "따로 작업 중";
    const stW = textW(st, 10.5);
    const cx0 = bx + NODE_R + 10;
    const room = VB_W - cx0 - stW - 22;
    const nm = fitText(b.name, [12, 11], Math.max(70, room));
    const cw = textW(nm.text, nm.fs) + 20;
    s += `<rect x="${cx0}" y="${laneY - 12}" width="${cw}" height="24" rx="7" fill="${BR}" opacity="0.16"/>
      <text class="gc-b" x="${cx0 + cw / 2}" y="${laneY + 4}" text-anchor="middle" style="font-size:${nm.fs}px">${esc(nm.text)}</text>
      <text class="gc-e" x="${cx0 + cw + 9}" y="${laneY + 4}">${st}</text>`;
  });

  nodes.forEach((n, i) => {
    s += nodeChip(xs[i], n.color, n.title, n.sub, chipMax);
    s += n.muted
      ? `<circle cx="${xs[i]}" cy="${MAIN_Y}" r="${NODE_R - 1}" fill="var(--surface-1)" stroke="${MUT}" stroke-width="2.5" stroke-dasharray="4,3"/>`
      : `<circle cx="${xs[i]}" cy="${MAIN_Y}" r="${NODE_R}" fill="${n.color}"/>`;
  });

  s += `</svg>`;

  const brNote = side.length
    ? `<span class="fb">브랜치 ${branches.length}개</span>`
    : `<span class="fb muted">브랜치 ${def.name} 하나</span>`;

  return `<div class="flow-card s-${p.overall}">
    <div class="flow-head"><span class="flow-title">${esc(p.title)}</span>
      <span class="flow-right">${brNote}${chip(p.overall)}</span></div>${s}</div>`;
}

      desc: "상태별로 묶어서 보여줍니다. 한 줄이 프로젝트 하나이고, 왼쪽 세로 색 막대와 그룹 제목으로 상태를 구분합니다.",
      html: `<div class="panel">${matrixHtml(data)}</div>`
    },
    {
      id: "actions", label: "손봐야 할 것", count: needsAction, alert: urgent.length > 0,
      title: "지금 손봐야 할 것",
      desc: "급한 것과 나중에 봐도 되는 것을 나눠 놓았습니다. 각 항목 아래 화살표는 무엇을 하면 되는지 알려줍니다.",
      html: `<div class="panel">
        ${urgent.length ? `<div class="group">${groupHead("serious", urgent.length, "서비스에 지금 영향이 있습니다")}
          ${urgent.map(p => `<div class="act-major">
            <div class="mk">▲</div>
            <div><div class="t">${esc(p.title)}</div><div class="d">${esc(p.note)}</div>
            <div class="fix">🔧 ${esc(fixHint(p))}</div></div>
          </div>`).join("")}</div>` : ""}
        ${later.length ? `<div class="group">${groupHead("warning", later.length, "급하지 않습니다")}
          ${later.map(p => `<div class="act-minor">
            <div class="mk">◆</div>
            <div><div class="t">${esc(p.title)}</div><div class="d">${esc(p.note)}</div>
            <div class="fix">${esc(fixHint(p))}</div></div>
          </div>`).join("")}</div>` : ""}
        ${!needsAction ? emptyHtml("손봐야 할 항목이 없습니다. 전부 정상입니다.") : ""}
      </div>`
    },
    {
      id: "flow", label: "배포 흐름", count: flowCards.length,
      title: "배포가 흘러가는 구조",
      desc: "코드가 어디를 거쳐 서비스가 되는지 깃 그래프로 그렸습니다. 보라색이 기본 브랜치 줄기, 초록색이 갈라져 나온 브랜치입니다. 점선은 아직 연결되지 않았거나, 기본 브랜치와 같은 위치라 아직 작업이 없다는 뜻입니다.",
      html: `<div class="panel"><div class="flow-grid">${
        flowCards.length ? flowCards.map(flowCardHtml).join("") : emptyHtml("플랫폼에 연결된 프로젝트가 아직 없습니다.")
      }</div></div>`
    },
    {
      id: "unlinked", label: "미연결 저장소", count: unlinked.length,
      title: "아직 플랫폼에 안 붙은 저장소",
      desc: "GitHub에만 있고 DB·배포가 연결되지 않은 저장소입니다. 초기 단계이거나 정리 대상일 수 있습니다.",
      html: `<div class="panel"><div class="note-grid">${
        unlinked.length ? unlinked.map(p => `<div class="note k-warning">
            <div class="ic">◆</div>
            <div><div class="nt">${esc(p.title)}</div>
            <div class="nm">GitHub · ${esc(p.github.visibility)} · 브랜치 ${(p.branches || []).length || 1}개</div>
            <div class="nd">${esc(p.note)}</div></div>
          </div>`).join("") : emptyHtml("모든 저장소가 플랫폼에 연결되어 있습니다.")
      }</div></div>`
    },
    {
      id: "orphan", label: "주인 없는 DB", count: data.orphanSupabase.length,
      title: "주인을 못 찾은 Supabase DB",
      desc: "어떤 저장소와 짝인지 이름으로 확인되지 않는 DB입니다. 안 쓰는 것이면 삭제해 정리할 수 있습니다.",
      html: `<div class="panel"><div class="note-grid">${
        data.orphanSupabase.length
          ? data.orphanSupabase.map(o => `<div class="note k-warning">
              <div class="ic">⚡</div>
              <div><div class="nt">${esc(o.name)}</div>
              <div class="nm">${esc(o.region)} · ${esc(o.status)}</div>
              <div class="nd">${esc(o.note)}</div></div>
            </div>`).join("")
          : emptyHtml("모든 DB가 저장소와 짝이 맞습니다.")
      }</div></div>`
    },
    {
      id: "other", label: "다른 스택", count: otherStack.length,
      title: "다른 스택으로 돌아가는 것",
      desc: "Supabase·Vercel을 쓰지 않아 위 집계와 별개로 관리되는 프로젝트입니다.",
      html: `<div class="panel"><div class="note-grid">${
        otherStack.length
          ? otherStack.map(p => `<div class="note k-neutral">
              <div class="ic">◇</div>
              <div><div class="nt">${esc(p.title)}</div>
              <div class="nm">${esc(p.otherStack)}</div>
              <div class="nd">${esc(p.note)}</div></div>
            </div>`).join("")
          : emptyHtml("해당하는 프로젝트가 없습니다.")
      }</div></div>`
    }
  ];
}

/* ---------------- app ---------------- */
function mount(data){
  const views = buildViews(data);
  const nav = document.getElementById("nav");
  const main = document.getElementById("main");

  nav.innerHTML = views.map((v, i) => `
    <button type="button" data-view="${v.id}" aria-current="${i === 0}">
      <span class="n">${i}</span>
      <span class="lbl">${v.label}</span>
      ${v.count === null ? "" : `<span class="cnt${v.alert ? " alert" : ""}">${v.count}</span>`}
    </button>`).join("");

  main.innerHTML = views.map((v, i) => `
    <section class="view${i === 0 ? " is-active" : ""}" id="view-${v.id}">
      <div class="view-head"><h1>${v.title}</h1><p>${v.desc}</p></div>
      ${v.html}
    </section>`).join("");

  document.getElementById("sideFoot").innerHTML = `
    <div class="sync">⏱ 매시간 자동 갱신</div>
    <div class="line">스냅샷 ${esc(data.snapshot)}</div>
    <div class="line">GitHub <code>${esc(data.github.user)}</code></div>
    <div class="line">Supabase <code>${esc(data.supabaseOrg.plan)}</code> · Vercel <code>${esc(data.vercelTeam.name)}</code></div>`;

  const ids = views.map(v => v.id);
  function show(id, push){
    if (!ids.includes(id)) id = ids[0];
    nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-current", String(b.dataset.view === id)));
    main.querySelectorAll(".view").forEach(s => s.classList.toggle("is-active", s.id === "view-" + id));
    if (push && location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
    window.scrollTo({ top: 0 });
  }

  nav.addEventListener("click", e => {
    const b = e.target.closest("button[data-view]");
    if (b) show(b.dataset.view, true);
  });
  main.addEventListener("click", e => {
    const g = e.target.closest("button[data-goto]");
    if (g) show(g.dataset.goto, true);
  });
  window.addEventListener("hashchange", () => show(location.hash.slice(1), false));

  show(location.hash.slice(1) || ids[0], false);
}

mount(DATA);
</script>
</body>
</html>
